# Merge these entries into the pubspec.yaml that `flutter create` wrote. Keep its name, description, version and
# environment lines. Every version below is one that resolves offline from a warm pub cache: run
# `flutter pub get --offline` first, and plain `flutter pub get` only when a package is missing.

dependencies:
  flutter:
    sdk: flutter
  # Material moved out of the framework into this package (Flutter 3.47). flutter create adds it; keep it.
  material_ui: ^1.8.0
  # Material, Cupertino and widget translations for every locale the app supports (date pickers, the text menu).
  flutter_localizations:
    sdk: flutter
  # flutter_localizations pins the exact intl version. `any` follows that pin, so a Flutter upgrade never breaks
  # `pub get` over an intl range typed here by hand.
  intl: any
  dio: ^5.11.1
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  # The one icon family of the app (F10). With a designer's SVG set instead, replace it with flutter_svg: ^2.3.0.
  lucide_icons_flutter: ^4.0.1
  shared_preferences: ^2.5.6
  # Remove cupertino_icons: flutter create adds it and nothing in the app uses it (F10).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Tests keep AppPreferences in memory (InMemorySharedPreferencesAsync): the platform store is unset under
  # flutter test, and the computer's own store must stay untouched. The app never imports it.
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  # gen-l10n builds lib/core/l10n/generated/ from the ARB files (settings in l10n.yaml).
  generate: true
  assets:
    # Created from assets/.env.example and git-ignored: public values only, the APK ships it as plain text.
    - assets/.env
  # One bundled family, every weight the app uses declared here, never google_fonts at run time (F8). When the
  # design picks a family, put its files in assets/fonts/, uncomment this block and set AppTextStyles.fontFamily.
  # fonts:
  #   - family: AppSans
  #     fonts:
  #       - asset: assets/fonts/AppSans-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/AppSans-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/AppSans-SemiBold.ttf
  #         weight: 600
